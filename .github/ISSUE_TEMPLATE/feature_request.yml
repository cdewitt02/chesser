name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `docs/opensource-readiness/01-roadmap.md` lists what is already planned
        and why, with the tradeoffs written down. Worth a look first — the answer
        may be there, along with the reasoning.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you are in, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Existing workarounds, and why they fall short.
